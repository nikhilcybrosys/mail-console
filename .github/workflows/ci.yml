name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mailconsole
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mailconsole
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailconsole" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MC_DB_HOST: 127.0.0.1
      MC_DB_PORT: "5432"
      MC_DB_USER: mailconsole
      MC_DB_PASSWORD: ci-only-password
      MC_DB_SSLMODE: prefer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit, security and UI-contract tests
        run: python -m pytest -p no:cacheprovider
      - name: Django deployment checks (production settings)
        env:
          MC_DEBUG: "0"
          MC_SECRET_KEY: ci-only-key-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOP
          MC_CONSOLE_HOST: console.example
          MC_MAILVIEW_HOST: mailview.example
        run: python manage.py check --deploy --fail-level WARNING
      - name: Migrations are up to date
        env:
          MC_DEBUG: "1"
          MC_SECRET_KEY: ci-only
        run: python manage.py makemigrations --check --dry-run

  supply-chain:
    name: Dependencies (vulnerabilities and licences)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the pinned runtime set exactly as the image does
        run: |
          python -m venv /tmp/runtime
          /tmp/runtime/bin/pip install -r requirements.lock
          pip install pip-audit pip-licenses
      - name: Known vulnerabilities in the pinned set
        run: pip-audit -r requirements.lock --strict
      - name: No GPL/AGPL runtime dependencies (LGPL is fine as an unmodified dependency)
        run: pip-licenses --python /tmp/runtime/bin/python --partial-match --fail-on "GNU General Public License;GNU Affero" --format=markdown

  docker:
    name: Docker image and demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the Dockerfile
        run: docker run --rm -i hadolint/hadolint < Dockerfile
      - name: Build and start the demo, then wait until healthy
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Smoke test
        run: |
          set -eux
          curl -fsS http://127.0.0.1:8000/healthz/
          curl -fsS -o /dev/null http://127.0.0.1:8000/login/
          curl -fsS -c /tmp/jar -o /dev/null "http://127.0.0.1:8000/dev-login/?email=admin@example.com"
          curl -fsS -b /tmp/jar -o /dev/null http://127.0.0.1:8000/
          curl -fsS -b /tmp/jar -o /dev/null http://127.0.0.1:8000/messages/
      - name: The container runs unprivileged
        run: test "$(docker compose exec -T web id -u)" = "10001"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down --volumes

  dco:
    name: Sign-off (DCO)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit in the pull request has a Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $sha has no Signed-off-by line (use git commit -s). See CONTRIBUTING.md."
              missing=1
            fi
          done
          exit $missing
